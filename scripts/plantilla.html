<style>
:root{--azul:#1a237e;--azul2:#283593;--azul3:#3949ab;--amarillo:#ffd600;--bg:#eef0f8;--verde:#0f9d58;--amber:#f59e0b;--rojo:#ef4444;--tint:#dcecfb;--base:#e7e8f0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:#1c1c1a;font-size:13px;}
header{background:var(--azul);padding:0 22px;display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:4px solid var(--amarillo);position:sticky;top:0;z-index:60;}
.hdr-logo{height:34px;filter:brightness(0) invert(1);}
.hdr-div{width:1px;height:32px;background:rgba(255,255,255,.2);}
.hdr-text{flex:1;} .hdr-text h1{color:#fff;font-size:1.05rem;font-weight:800;} .hdr-text small{color:rgba(255,255,255,.55);font-size:.7rem;}
.hdr-badge{background:var(--amarillo);color:var(--azul);font-size:.68rem;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;}
.btns{display:flex;gap:7px;} .btns button{font:inherit;font-size:.7rem;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:6px 10px;} .btns button:hover{background:rgba(255,255,255,.22);}
.wrap{padding:12px 22px 46px;}
/* ⚠️ Los filtros generales quedan congelados al scrollear, como las solapas
   (Erik, 19/10). Van APILADOS bajo el encabezado, que mide 56px. El `top` de las
   solapas no se escribe a mano: se MIDE, porque esta barra envuelve en dos renglones
   segun el ancho de la pantalla. */
.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(26,35,126,.12);padding:2px 14px;margin-bottom:0;position:sticky;top:56px;z-index:31;}
.dd{position:relative;display:flex;align-items:center;gap:7px;}
.dd .cap{display:inline-block;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--azul3);margin-bottom:0;white-space:nowrap;}
.dd-btn{display:flex;align-items:center;gap:7px;width:158px;height:24px;font:inherit;cursor:pointer;background:#f8f9ff;border:1px solid #c5cae9;border-radius:7px;padding:0 10px;color:var(--azul);text-align:left;}
.dd-btn:hover,.dd-btn:focus{border-color:var(--azul3);outline:none;}
.dd-btn .cnt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem;font-weight:700;}
.dd-btn.empty .cnt{color:#9aa0c9;font-weight:600;}
.dd-btn .arw{color:var(--azul3);font-size:.62rem;} .dd-btn .dd-cnt{font-size:.6rem;font-weight:800;color:#fff;background:var(--azul3);border-radius:20px;padding:1px 6px;} .dd-btn.empty .dd-cnt{display:none;}
.dd-panel{display:none;position:absolute;top:100%;margin-top:4px;right:0;width:270px;max-width:88vw;background:#fff;border:1px solid #c5cae9;border-radius:10px;box-shadow:0 8px 24px rgba(26,35,126,.22);z-index:55;padding:8px;}
.dd.open .dd-panel{display:block;}
.dd-panel .mini{width:100%;padding:6px 9px;border:1px solid #c5cae9;border-radius:7px;font:inherit;font-size:.75rem;margin-bottom:6px;color:var(--azul);}
.dd-list{max-height:198px;overflow:auto;}
.dd-list .it{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border-radius:6px;font-size:.77rem;color:var(--azul);}
.dd-list .it:hover{background:#eef0f8;} .dd-list .it.on{background:#e3e7fb;font-weight:700;} .dd-list .it .n{margin-left:auto;color:#7986cb;font-size:.67rem;}
.dd-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eceef7;margin-top:6px;padding-top:6px;} .dd-foot span{font-size:.67rem;color:#7986cb;}
.linkbtn{background:none;border:none;color:var(--azul3);font-weight:700;font-size:.7rem;cursor:pointer;text-decoration:underline;padding:0;}
.clearall{align-self:center;}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:.76rem;color:var(--azul);background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(26,35,126,.08);padding:8px 14px;margin-bottom:10px;}
.legend b{font-weight:800;font-size:.9rem;} .legend .k{color:#7986cb;font-weight:700;text-transform:uppercase;font-size:.58rem;letter-spacing:.04em;margin-right:4px;} .legend .sep{width:1px;height:22px;background:#e3e7fb;}
.res-toggle{display:flex;align-items:center;gap:8px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--azul3);cursor:pointer;margin-bottom:8px;user-select:none;} .res-toggle .ln{flex:1;height:2px;background:var(--amarillo);}
#resumen{margin-bottom:12px;} #resumen.collapsed{display:none;}
.mes-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
.mes-sel .lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;color:#7986cb;letter-spacing:.05em;margin-right:2px;}
.chip{border:1px solid #c5cae9;background:#f8f9ff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:.74rem;font-weight:700;user-select:none;color:var(--azul);}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul);}
.mes-block{margin-bottom:14px;}
.mes-h{font-size:.82rem;font-weight:800;color:#fff;background:var(--azul2);border-left:4px solid var(--amarillo);border-radius:6px;padding:5px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.mb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.pedido{display:block;margin-bottom:0;}
.impo{width:100%;height:216px;background:#fff;border:1px solid #e8eaf6;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.impo-h{background:var(--azul);color:#fff;padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--amarillo);}
.impo-h .code{font-size:.74rem;color:var(--amarillo);font-weight:800;margin-left:auto;}
.impo-sub{font-size:.64rem;color:#5f6690;padding:5px 10px 2px;line-height:1.5;}
.impo-gas{padding:2px 10px 6px;}
.impo-gas .g{display:flex;align-items:baseline;gap:6px;font-size:.7rem;padding:2px 0;border-bottom:1px solid #f3f4f9;}
.impo-gas .g span{color:#5f6690;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .impo-gas .g b{color:var(--azul);font-weight:800;} .impo-gas .g i{color:#7986cb;font-style:normal;font-size:.64rem;min-width:96px;text-align:right;}
.impo-tot{display:flex;justify-content:space-between;font-size:.68rem;font-weight:800;color:var(--azul);padding:6px 10px;background:#fff5cc;}
.impo-tot.tot-ok{background:#10b98126;color:#0f7a4d;} .impo-tot.tot-proy{background:#a855f726;color:#6b21a8;}
.badge{font-size:.56rem;font-weight:800;padding:2px 7px;border-radius:20px;}
.b-ok{background:#10b98133;color:#6ee7b7;} .b-proy{background:#a855f733;color:#d8b4fe;} .b-neu{background:#ffffff26;color:#e5e7eb;}
.pdonuts{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;}
.pdonut{width:162px;height:216px;background:#fff;border:1px solid #e8eaf6;border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;}
.pdonut .gname{font-size:.66rem;font-weight:800;color:var(--azul);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.pdonut .dc{position:relative;flex:1;min-height:118px;} .pdonut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.pdonut .ctr b{font-size:1.2rem;font-weight:900;color:var(--azul);line-height:1;} .pdonut .ctr span{font-size:.5rem;color:#7986cb;text-transform:uppercase;}
.pdonut .cap{font-size:.72rem;font-weight:800;color:var(--azul3);margin-top:6px;}
.impo-hint{color:#7986cb;font-size:.76rem;font-weight:600;padding:10px 2px;}
.tablewrap{overflow:auto;border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(26,35,126,.12);max-height:72vh;}
table{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;width:max-content;}
th,td{border-right:1px solid #eceef7;border-bottom:1px solid #eceef7;padding:5px 8px;line-height:15px;color:#1c1c1a;overflow:hidden;text-overflow:ellipsis;}
thead th{position:sticky;font-weight:800;z-index:3;}
thead tr.r1 th{top:0;height:30px;background:var(--azul);color:#fff;font-size:10px;text-align:center;vertical-align:middle;}
thead tr.r2 th{top:30px;height:28px;background:var(--azul2);color:#c5cae9;font-size:10px;text-transform:uppercase;letter-spacing:.03em;box-shadow:inset 0 -3px 0 var(--amarillo);}

td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.f0{width:74px;min-width:74px;max-width:74px;}.f1{width:74px;min-width:74px;max-width:74px;}.f2{width:78px;min-width:78px;max-width:78px;}.f3{width:68px;min-width:68px;max-width:68px;}.f4{width:74px;min-width:74px;max-width:74px;}.f5{width:74px;min-width:74px;max-width:74px;}
.id0,.id1,.id2,.id3,.id4,.id5,.id6{position:sticky;}
.id0{left:0;width:66px;min-width:66px;max-width:66px;}.id1{left:66px;width:110px;min-width:110px;max-width:110px;}.id2{left:176px;width:var(--cw,92px);min-width:var(--cw,92px);max-width:var(--cw,92px);}.id3{left:calc(176px + var(--cw,92px));width:48px;min-width:48px;max-width:48px;text-overflow:clip;}.id4{left:calc(224px + var(--cw,92px));width:48px;min-width:48px;max-width:48px;}.id5{left:calc(272px + var(--cw,92px));width:62px;min-width:62px;max-width:62px;}.id6{left:calc(334px + var(--cw,92px));width:64px;min-width:64px;max-width:64px;}
tbody .id0,tbody .id1,tbody .id2,tbody .id3,tbody .id4,tbody .id5,tbody .id6{background:var(--base);z-index:2;}
thead tr.r2 th.id0,thead tr.r2 th.id1,thead tr.r2 th.id2,thead tr.r2 th.id3,thead tr.r2 th.id4,thead tr.r2 th.id5,thead tr.r2 th.id6{z-index:5;}
/* El ancho del panel tiene que ser EXACTAMENTE el de las columnas fijas. Antes
   estaba fijo en calc(398px + --cw), una cuenta de cuando habia 8 columnas de
   identidad: al sacar UN y Meses max sobresalia 56px y tapaba el arranque del
   primer mes (se veia "OCK I." en vez de "STOCK I."). --idw lo mide el JS. */
.idpanel{position:sticky;left:0;z-index:6;width:var(--idw,538px);max-width:var(--idw,538px);overflow:hidden;}
#tw-fc{scroll-snap-type:x mandatory;scroll-padding-left:var(--idw,594px);}
#tabla thead tr.r1 th.mcol{scroll-snap-align:start;}
/* .mhold agrupa el nombre del mes y su selector. Ya no va pegajoso: con el
   enganche del scroll un mes nunca queda a medias, asi que el titulo va
   centrado sobre su bloque, como corresponde. */
.idc{position:sticky;}/* la ultima columna fija lleva un borde con sombra: al scrollear de costado, las
   columnas de mes pasan por debajo y sin este corte se leian como rotas */
.idend{border-right:2px solid #c5cae9;box-shadow:7px 0 9px -5px rgba(26,35,126,.30);}
thead tr.r2 th.idend{box-shadow:inset 0 -3px 0 var(--amarillo),7px 0 9px -5px rgba(26,35,126,.30);}
.idpanel{box-shadow:7px 0 9px -5px rgba(26,35,126,.30);}tbody td.idc{background:var(--base);z-index:2;}thead tr.r2 th.idc{z-index:5;}
.colx{position:absolute;right:4px;top:50%;transform:translateY(-50%);cursor:pointer;color:#ff8a80;font-weight:800;font-size:.74rem;line-height:1;}.colx:hover{color:#fff;}
thead tr.r2 th.hcol{padding-right:15px;}
.colshow{cursor:pointer;color:var(--amarillo);text-decoration:underline;font-weight:700;margin-left:6px;}
.dotbar{display:flex;justify-content:flex-start;padding:2px 2px 6px;}
.dotcfg{font-size:.72rem;color:#5f6690;display:inline-flex;align-items:center;gap:3px;}
.mhold{display:flex;align-items:center;justify-content:center;gap:10px;}
.smsel{font-size:.56rem;font-weight:400;color:#c5cae9;white-space:nowrap;}.smsel select{font-size:.56rem;padding:0 2px;margin-left:2px;}
.dotinp{width:42px;text-align:center;border:1px solid var(--azul3);border-radius:5px;padding:2px 4px;font:inherit;font-size:.72rem;margin-left:4px;}
tbody td.mo{background:var(--tint);}
tbody tr:hover td{background:#fff6c9!important;}
td.code{font-weight:800;color:var(--azul);}
.mg-a{border-left:2px solid #b9c0e6;}
.t-buy{color:var(--azul3);font-weight:800;} .t-zero{color:#c9cee9;} .t-grn{color:var(--verde);font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.mwrap{display:flex;align-items:center;justify-content:flex-end;gap:4px;width:100%;} .mwrap .dot{margin:0;flex:none;} .mn{font-variant-numeric:tabular-nums;}
.dnone{background:transparent!important;box-shadow:none!important;}
.liqbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(26,35,126,.04),0 6px 18px rgba(26,35,126,.06);padding:6px 14px;margin-bottom:8px;flex-wrap:wrap;}
.acmode{display:inline-flex;border:1px solid var(--azul);border-radius:6px;overflow:hidden;}.acbtn{border:0;padding:4px 12px;font-size:.72rem;cursor:pointer;background:#fff;color:var(--azul);}.acbtn.on{background:var(--azul);color:#fff;font-weight:700;}
.liqbar .liqlbl{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--azul3);}
.liqbar select{font:inherit;font-size:.78rem;font-weight:700;color:var(--azul);border:1px solid #c5cae9;border-radius:7px;padding:5px 9px;background:#f8f9ff;cursor:pointer;}
.liqbar .liqinfo{font-size:.66rem;color:#7986cb;}
.mtog{font:inherit;font-size:.62rem;font-weight:700;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 10px;cursor:pointer;}
.d-red{background:var(--rojo);box-shadow:0 0 5px #ef444488;} .d-yel{background:var(--amber);box-shadow:0 0 5px #f59e0b88;} .d-grn{background:#10b981;box-shadow:0 0 5px #10b98188;}
.cat{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.62rem;font-weight:800;}
.cat-A,.cat-B,.cat-C,.cat-D,.cat-P,.cat-N{background:#dfe3f3;color:#303f9f;}
tfoot td{position:sticky;bottom:0;background:#fff5cc;font-weight:800;border-top:2px solid var(--amarillo);color:var(--azul);z-index:2;} tfoot td.idpanel{background:#fdeeb0;z-index:6;left:0;}
/* ⚠️ ACOTADA a sus dos usos reales (19/10). Sin el `td`/`div`, esta regla le pegaba
   tambien al boton de un filtro sin seleccion --lleva `class="dd-btn empty"` para
   pintar el texto en gris-- y lo inflaba de 24 a 58px de alto. Como casi siempre los
   cinco filtros estan en "Todos", la barra medía 131px en vez de ~45. */
td.empty,div.empty{padding:28px;text-align:center;color:#7986cb;font-weight:700;}
.liqsum{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(26,35,126,.08);padding:12px 16px;margin-top:12px;}
.liqsum-h{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--azul);font-size:.9rem;margin-bottom:10px;flex-wrap:wrap;}
.liqsum-h .n{color:var(--verde);}
.liqsum-h button{margin-left:auto;font:inherit;font-size:.72rem;font-weight:700;background:var(--verde);color:#fff;border:none;border-radius:7px;padding:6px 12px;cursor:pointer;}
.liqga{display:flex;gap:12px;align-items:baseline;font-size:.78rem;padding:4px 0;border-bottom:1px solid #f0f1f8;}
.liqga b{color:var(--azul);min-width:190px;}
.liqga .tot{color:var(--verde);font-weight:800;min-width:36px;text-align:right;}
.liqga .cats{color:#5f6690;font-size:.72rem;}
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab{font:inherit;font-size:.82rem;font-weight:800;cursor:pointer;background:#fff;border:1px solid #c5cae9;border-radius:8px 8px 0 0;padding:6px 15px;color:var(--azul3);}
.tab.on{background:var(--azul);color:#fff;border-color:var(--azul);border-bottom:3px solid var(--amarillo);}
/* ⚠️ Los 8px que antes eran `margin-bottom` de la barra de filtros ahora son
   RELLENO de las solapas: como franja de margen quedaban transparentes y por ahi
   pasaban las lineas de los graficos al scrollear. Un elemento pegajoso tapa lo que
   mide, no lo que ocupa con sus margenes. */
.tabs{border-bottom:2px solid #d6dae8;position:sticky;top:56px;z-index:30;background:#fff;padding:13px 22px 0;margin-left:-22px;margin-right:-22px;}
.vpnote{font-size:.72rem;color:#7986cb;margin-bottom:8px;}
.vptable{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;}
.vptable th,.vptable td{border-right:1px solid #eceef7;border-bottom:1px solid #eceef7;padding:6px 8px;}
.vptable thead th{position:sticky;top:0;background:var(--azul);color:#fff;z-index:3;font-weight:800;font-size:10px;text-align:center;}
.vptable thead tr.r2b th{top:110px;background:var(--azul2);color:#c5cae9;font-size:10px;text-transform:uppercase;box-shadow:inset 0 -3px 0 var(--amarillo);}
.vptable thead tr.r1 th{vertical-align:top;height:110px;padding-top:6px;}
.vptable thead tr.r1 th.mcol{box-shadow:none;}
.vptable thead tr.r1 th.vpid{box-shadow:inset 0 -3px 0 var(--amarillo);}
.vptable .vpmes{font-size:1.12rem;font-weight:800;color:var(--amarillo);text-transform:uppercase;letter-spacing:.5px;}
.vptable .vpratio{font-size:.68rem;color:#ffe066;font-weight:700;margin-top:1px;}
.vptable .trh{background:#0d1b5e;color:#ffe066;}
.vptable td.trh2{background:#f3f4fb;font-weight:700;}
.vptable .trsep{border-left:3px solid var(--amarillo)!important;}
.vptable tfoot td{position:sticky;bottom:0;background:#fff5cc;font-weight:800;border-top:2px solid var(--amarillo);color:var(--azul);z-index:2;}
.vptable tfoot td.vpid{left:0;z-index:5;}
.tcinput{width:74px;font:inherit;font-size:.62rem;text-align:right;border:1px solid var(--amarillo);border-radius:4px;padding:1px 4px;background:#fff;color:var(--azul);font-weight:700;}
.seinput{width:34px;font:inherit;font-size:.6rem;text-align:right;border:1px solid var(--amarillo);border-radius:4px;padding:1px 3px;background:#fff;color:var(--azul);font-weight:700;}
.seinput.simon{background:#fff5cc;border-color:#e6a700;color:#8a5a00;}
.vptc{margin-top:4px;font-size:.7rem;color:#dfe3ff;}
.vpseason{margin-top:3px;}
.vprow{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:2px;font-size:.7rem;color:#dfe3ff;font-weight:700;}
.vprow .vplbl{width:34px;text-align:right;}
.vprow .vppc{width:10px;text-align:left;}
.tcinput.simon{background:#fff5cc;border-color:#e6a700;color:#8a5a00;}
.vprst{position:absolute;top:3px;right:5px;background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:5px;font-size:.72rem;cursor:pointer;padding:0 4px;line-height:1.4;}
.vprst:hover{background:#ffffff22;}
.vprst.simon{background:#ffd600;color:#0d1b5e;border-color:#ffd600;}
.vptotwrap{margin-top:4px;font-size:.76rem;color:#ffe066;font-weight:800;}
.vptable .vpsub{font-size:.5rem;color:#ffe066;font-weight:600;margin-top:2px;}
.vptable .vpid{position:sticky;left:0;background:#fff;z-index:4;font-weight:700;color:var(--azul);min-width:232px;max-width:232px;overflow:hidden;text-overflow:ellipsis;}
.vptable thead .vpid{z-index:5;background:var(--azul);color:#fff;}
.vptable td.num,.vptable th.num{text-align:right;font-variant-numeric:tabular-nums;}
.vptable td.vpusd{color:var(--verde);font-weight:700;}
.vptable td.vpcmvc{color:#c0392b;font-weight:700;}
.vptable td.vpcv{color:#1a237e;font-weight:700;}
.vptable.histt thead tr.r1 th{vertical-align:top;padding-top:6px;}
/* ⚠️ Un solo alto para las tres tablas (Proyección, Histórico VP/VR y la foto de
   estados): al alternar las vistas el encabezado saltaba de 106 a 75 px.
   El top de la segunda fila lo escribe fijarR2() midiendo, no este CSS. */
/* Los dos gráficos van lado a lado: apilados empujaban la tabla fuera de pantalla. */
/* Los seis graficos, 2 por fila y 3 filas. ⚠️ flex-basis 48%: el doble de ancho
   que con tres, que es lo que va a hacer falta al sumar meses. */

<script>
const DATA = /*__DATA__*/;
const MFIELDS=["Stock inicio","Meses inicio","Compra","Venta proy.","Stock final","Meses fin"];
// Abreviaturas de grupo, SOLO para mostrar. Los nombres largos obligaban a
// ensanchar la columna Grupo y se cortaban en Proyeccion. DATA.GA conserva el
// nombre completo: el orden, los filtros, las claves de agrupacion y lo que sale
// en el Excel y el CSV siguen usando ese.
const GAABR={'Portaescobillas de alternador':'PE alternador',
             'Portaescobillas de arranque':'PE arranque'};
const gaLbl=g=>GAABR[g]||g;
// Cuantas filas se dibujan de entrada en las tablas grandes. Ver armar_tope.py:
// 5.527 filas tardan 1.467 ms y 500 tardan menos de 100. El orden se aplica ANTES
// del corte, asi que arriba siempre queda lo que se esta buscando.
const CAP=500;

// ⚠️ Se lee y escribe con guarda: este bloque esta ANTES del `const st`, asi que
// no se puede tocar `st` aca afuera (daria 'Cannot access st before
// initialization'). Dentro de las funciones no hay problema: corren despues.
// Crece de a CAP con "ver mas", nunca de golpe: un "ver todo" volveria a pagar
// el segundo y medio entero de una sola vez.
const vt=t=>(st.tope&&st.tope[t])||CAP;
function verMas(t){(st.tope=st.tope||{})[t]=vt(t)+CAP;st.dirty[t]=true;renderTab(t);}
// El pie de las tablas topeadas.
function pieTope(t,total,vistas,nota){
  if(vistas>=total)return '';
  const mas=Math.min(CAP,total-vistas);
  return '<div style="text-align:center;padding:9px;font-size:.72rem;color:#5f6690;">'
    +'Mostrando '+fmtI(vistas)+' de '+fmtI(total)+' · '
    +'<b onclick="verMas(&quot;'+t+'&quot;)" style="cursor:pointer;color:#1a237e;'
    +'text-decoration:underline;">ver '+fmtI(mas)+' más</b>'+(nota?'<span style="color:#8a90b0;margin-left:8px;">'+nota+'</span>':'')+'</div>';}
const MSHORT=["Stock I.","Meses I.","Compra","VP","Stock F.","Meses F."];
// Lo que dice cada abreviatura al pasar el mouse por encima.
const MLONG=["Stock al inicio del mes","Meses de cobertura al inicio del mes","Compra del mes","Venta proyectada","Stock al fin del mes","Meses de cobertura al fin del mes"];
const ALLM=DATA.months.map((_,i)=>i);
const IDEAL=78;const CAJAX=105;
const PRIORITY=["Motores de arranque","Carcasas","Inducidos","Solenoides","Alternadores","Estatores","Rotores","Bujes de plástico","Portaescobillas de arranque","Portaescobillas de alternador","Escobillas de arranque","Escobillas de alternador","Impulsores","Poleas de alternador","Extractores de polea","Reductores","Planetarios","Reguladores de voltaje","Plaquetas rectificadoras","Diodos","Rodamientos","Lámparas principales","Lámparas auxiliares","Faros y barras"];

function gaPrio(gi){return prioName(DATA.GA[gi]);}
const DIMS=[["UN","1 · Unidad de negocio","Unidad de negocio","Buscar..."],["GA","2 · Grupo de artículos","Grupo de artículos","Buscar GA..."],["CAT","3 · Categoría","Categoría","Buscar..."],["COD","4 · Código","Código","Buscar código..."],["EST","5 · Estado","Estado","Buscar..."]];
const st={UN:new Set(),GA:new Set(),CAT:new Set(),COD:new Set(),EST:new Set(),ROT:null,rotU:20,/* ⚠️ El umbral de presencia ya no tiene desplegable (Erik, 19/10: "sacalo al

  presU:50,excCut:1.5,rotSub:'sinrot',rotSort:null,RMES:new Set([0]),hideCols:new Set(),dotGap:1,stSort:'ga',stDir:1,smBasis:{},liq:null,liqMode:'all',acMode:'liq',dtoOf:0.1,ofQty:'all',minCM:0.10,dtoGap:0.05,tab:'fc',sort:null,dir:1,liqCM:false,mstart:{fc:0,vp:0,hist:0},simEstac:{},simEvento:{},histTC:{},liqSort:null,liqSortDir:-1,dirty:{fc:true,st:true,liq:true,vp:true,hist:true}};
function setLiq(){const v=document.getElementById("liqSel").value;if(!v){st.liqMode=null;st.liq=null;}else if(v==='qr'||v==='q0'||v==='all'){st.liqMode=v;st.liq=1;}else{st.liqMode='fac';st.liq=parseFloat(v);}renderTab('liq');}

let _vbK='',_vbC=null;function rowsBase(){
  const k=[...st.UN].join(',')+'|'+[...st.GA].join(',')+'|'+[...st.CAT].join(',')+'|'+[...st.COD].join(',');

function mROT(r){return !st.ROT||rotClase(r)===st.ROT;}
let _vrK='',_vrC=null;function visibleRows(){
  const k=[...st.UN].join(',')+'|'+[...st.GA].join(',')+'|'+[...st.CAT].join(',')+'|'+[...st.COD].join(',')
    +'|'+[...st.EST].join(',')+'|'+(st.excCut||1.5)+'|'+(st.ROT||'')+'|'+(st.rotU||20)+'|'+(st.presU||50);

function setSmSort(m,v){if(!v){st.sort=null;}else{st.sort={m:m,f:v==='ini'?1:5};}st.dir=1;renderForecast();}
// Cada desplegable muestra lo que existe con TODOS los otros filtros puestos, sin
// importar el orden. Antes la cadena era fija (UN -> GA -> CAT -> COD) y Estado no
// achicaba a nadie: se podia elegir Lanzamientos + Categoria D y quedaba vacio.
function rowsExcept(dim){
  return DATA.rows.filter(r=>(dim==='UN'||mUN(r))&&(dim==='GA'||mGA(r))
    &&(dim==='CAT'||mCAT(r))&&(dim==='COD'||mCOD(r))&&(dim==='EST'||mEST(r)));}
// Lo ya elegido no se cae de la lista aunque otro filtro lo deje en cero: si se
// cayera no habria forma de destildarlo y la tabla quedaria vacia sin explicacion.
function conElegidos(dim,lista,mk){
  const hay=new Set(lista.map(o=>o.key));
  st[dim].forEach(k=>{if(!hay.has(k))lista.push(mk(k));});
  return lista;}
function optionsFor(dim){
  const b=rowsExcept(dim);
  if(dim==='UN'){const c=countBy(b,0);
    return DATA.UN.map((v,i)=>({key:i,label:v,n:c.get(i)||0}));}
  if(dim==='GA'){const c=countBy(b,1);
    return conElegidos('GA',DATA.GA.map((v,i)=>({key:i,label:v,n:c.get(i)||0})).filter(o=>o.n>0),
      k=>({key:k,label:DATA.GA[k],n:0})).sort((a,b)=>prioName(a.label)-prioName(b.label));}
  if(dim==='CAT'){const c=countBy(b,3);
    return conElegidos('CAT',DATA.CAT.map((v,i)=>({key:i,label:v||'(s/cat)',n:c.get(i)||0})).filter(o=>o.n>0),
      k=>({key:k,label:DATA.CAT[k]||'(s/cat)',n:0}));}
  if(dim==='COD'){
    return conElegidos('COD',b.map(r=>({key:r[2],label:r[2],sub:DATA.GA[r[1]],n:null})),
      k=>({key:k,label:k,sub:'',n:null}));}
  if(dim==='EST'){const c={};b.forEach(r=>{const o=stkOf(r);if(o)c[o.k]=(c[o.k]||0)+1;});
    // ⚠️ "Sin rotacion" no entra en este filtro (Erik, 16/10): se filtra desde el
    // desplegable de Rotacion, que es donde vive junto a En baja y En alza.
    return conElegidos('EST',STK.filter(x=>x[0]!=='sinrot')
      .map(x=>({key:x[0],label:x[1],n:c[x[0]]||0})).filter(o=>o.n>0),
      k=>({key:k,label:STLBL[k]||k,n:0}));}
}
function renderPanel(dim){fijarTabs();const q=(document.getElementById('srch-'+dim).value||"").toLowerCase();let opts=optionsFor(dim);
  if(q)opts=opts.filter(o=>o.label.toLowerCase().includes(q)||(o.sub&&o.sub.toLowerCase().includes(q)));
  const cap=dim==='COD'?250:999;const shown=opts.slice(0,cap);
  let h=shown.map(o=>{const on=st[dim].has(o.key);const kk=typeof o.key==='number'?o.key:"'"+String(o.key).replace(/'/g,"\\'")+"'";
    return `<div class="it ${on?'on':''}" onclick="toggleOpt('${dim}',${kk})"><input type="checkbox" ${on?'checked':''} onclick="event.stopPropagation();toggleOpt('${dim}',${kk})"><span>${o.label}</span>${o.sub?'<span class="n">'+o.sub+'</span>':(o.n!=null?'<span class="n">'+o.n+'</span>':'')}</div>`;}).join("");
  if(opts.length>cap)h+=`<div style="padding:6px;color:#7986cb;font-size:.67rem">+${opts.length-cap} más… escribí para filtrar</div>`;
  document.getElementById('list-'+dim).innerHTML=h||'<div style="padding:8px;color:#7986cb;font-size:.72rem">Sin opciones</div>';
  document.getElementById('info-'+dim).textContent=st[dim].size?st[dim].size+" sel.":opts.length+" opciones";}
function toggleOpt(dim,key){st[dim].has(key)?st[dim].delete(key):st[dim].add(key);
  if(dim==='UN'){prune('GA',r=>mUN(r),1);prune('CAT',r=>mUN(r)&&mGA(r),3);pruneCOD();}
  if(dim==='GA'){if(st.GA.has(key)){const rr=DATA.rows.find(r=>r[1]===key);if(rr)st.UN.add(rr[0]);}prune('CAT',r=>mUN(r)&&mGA(r),3);pruneCOD();} if(dim==='CAT'){pruneCOD();} if(dim==='COD'){if(st.COD.has(key)){const rr=DATA.rows.find(r=>r[2]===key);if(rr){st.GA.add(rr[1]);st.UN.add(rr[0]);st.CAT.add(rr[3]);}}}
  renderAll();renderPanel(dim);}
function prune(dim,f,k){const av=new Set(DATA.rows.filter(f).map(r=>r[k]));[...st[dim]].forEach(i=>{if(!av.has(i))st[dim].delete(i);});}
function pruneCOD(){const av=new Set(DATA.rows.filter(r=>mUN(r)&&mGA(r)&&mCAT(r)).map(r=>r[2]));[...st.COD].forEach(c=>{if(!av.has(c))st.COD.delete(c);});}
function openPanel(dim,e){e.stopPropagation();const el=document.querySelector('.dd[data-dim="'+dim+'"]');const was=el.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));if(!was){el.classList.add('open');renderPanel(dim);}}
function selectAllF(dim,e){e.stopPropagation();const q=(document.getElementById('srch-'+dim).value||'').toLowerCase();let opts=optionsFor(dim);if(q)opts=opts.filter(o=>o.label.toLowerCase().includes(q)||(o.sub&&o.sub.toLowerCase().includes(q)));
  opts.forEach(o=>st[dim].add(o.key));
  if(dim==='UN'){prune('GA',r=>mUN(r),1);prune('CAT',r=>mUN(r)&&mGA(r),3);pruneCOD();}
  if(dim==='GA'){opts.forEach(o=>{const rr=DATA.rows.find(r=>r[1]===o.key);if(rr)st.UN.add(rr[0]);});prune('CAT',r=>mUN(r)&&mGA(r),3);pruneCOD();}
  if(dim==='COD'){opts.forEach(o=>{const rr=DATA.rows.find(r=>r[2]===o.key);if(rr){st.GA.add(rr[1]);st.UN.add(rr[0]);st.CAT.add(rr[3]);}});}
  if(dim==='CAT'){pruneCOD();}
  renderAll();renderPanel(dim);}

function coverage(gaName,m){let stk=0,vp=0;DATA.rows.forEach(r=>{if(DATA.GA[r[1]]!==gaName)return;if(!(mUN(r)&&mCAT(r)&&mCOD(r)))return;stk+=(mval(r,m,0)||0)+(mval(r,m,2)||0);vp+=mval(r,m,3)||0;});return {stk,vp,pct:stk>0?Math.round(vp/stk*1000)/10:null};}

      gas.sort((a,b)=>prioName(a.ga)-prioName(b.ga));nums[num].gas=gas;nums[num].tot=gas.reduce((s,x)=>s+(x.cant||0),0);nums[num].piT=gas.reduce((s,x)=>s+(x.pi||0),0);

    if(keys.length===0&&projGas.length===0){block+='<div class="impo-hint">Sin pedidos de importación para este filtro/mes.</div></div></div>';html+=block;return;}
    keys.forEach(num=>{const o=nums[num];const cls=o.estado==='confirmado'?'b-ok':o.estado==='proyectado'?'b-proy':'b-neu';const lbl=o.estado==='confirmado'?'Confirmado':o.estado==='proyectado'?'Proyectado':'—';

      <div class="impo-gas">${gasH}</div><div class="impo-tot ${totcls}"><span>Total pedido: ${fmtI(o.tot)} u</span><span>${fmtU(o.piT)}</span></div></div>

// ⚠️ EL ORDEN DE ARRANQUE DE TODAS LAS TABLAS: primero el grupo con la prioridad de
// los filtros, despues el codigo en orden NATURAL ('es',{numeric:true}).
// El natural importa: en alfabetico puro MA-10461025 cae entre MA-0037 y MA-3023,
// porque compara caracter por caracter. Son 370 codigos con numeros largos que se
// metian en el medio de los cortos. Erik lo vio filtrando Exceso: Estado Stock y
// Accion comercial mostraban listas distintas -- los mismos 1.751 codigos, pero
// ordenados distinto, y como cada tabla corta en 500 la primera pagina no coincidia.
function porCodigo(a,b){const pa=gaPrio(a[1]),pb=gaPrio(b[1]);if(pa!==pb)return pa-pb;
  return String(a[2]).localeCompare(String(b[2]),'es',{numeric:true});}
function sortRows(rows){if(!st.sort){return rows.slice().sort(porCodigo);}
  const s=st.sort,d=st.dir;if(typeof s==='object'&&s&&(s.f===1||s.f===5)){const isRed=r=>{const id=r[IDEAL];const v=mval(r,s.m,s.f);return (id!=null&&id>0&&v!=null&&v<minMeses(r,id))?0:1;};return rows.slice().sort((a,b)=>{const ra=isRed(a),rb=isRed(b);if(ra!==rb)return ra-rb;return porCodigo(a,b);});}const val=r=>{if(s==='cod')return r[2];if(s==='sa')return r[4]??-1;if(s==='ma')return r[5]??-1;return mval(r,s.m,s.f)??-1;};
  return rows.slice().sort((a,b)=>{const x=val(a),y=val(b);if(typeof x==='string')return d*String(x).localeCompare(String(y),'es',{numeric:true});return d*(x-y);});}
// Misma regla que Estado Stock y Accion comercial: un clic ordena de mayor a
// menor y el segundo vuelve al orden por codigo. Sin ida y vuelta y sin flechas.

  if(JSON.stringify(st.sort)===JSON.stringify(k)&&k!=='cod'){st.sort='cod';st.dir=1;}
  else{st.sort=k;st.dir=(k==='cod')?1:-1;}
  renderForecast();}

    MW.forEach((m,mi)=>{const mc=(mi%2)?' mo':'';for(let f=0;f<6;f++){const v=mval(r,m,f);const isM=(f===1||f===5);let cl="num f"+f+(f===0?" mg-a":"")+mc;if(f===2)cl+=(v>0?" t-buy":" t-zero");else if(f===3)cl+=" t-grn";body+='<td class="'+cl+'">'+(isM?mcell(v,minMeses(r,id),false):fmtI(v))+'</td>';}});

  // Calibrar el enganche del scroll lateral. Todo se mide del HTML: el bloque fijo
  // no mide la suma de los anchos declarados (la tabla estira GA) y los meses no

    const _cab=[...t.querySelectorAll('thead tr.r2 th.idc')];
    let _acc=0,_css='';
    _cab.forEach((th,i)=>{_css+='#tabla .idcp'+i+'{left:'+_acc.toFixed(2)+'px}';
      _acc+=th.getBoundingClientRect().width;});
    let _hoja=document.getElementById('idcpos');
    if(!_hoja){_hoja=document.createElement('style');_hoja.id='idcpos';document.head.appendChild(_hoja);}

    const _fijo=_acc;                            // ancho real del bloque fijo (suma medida)
    const _ini=_r1.left-_c.left+_w.scrollLeft;   // posicion del primer mes DENTRO del contenido
    const _mw=_r1.width;                                      // ancho real de un mes

    document.documentElement.style.setProperty('--idw',_fijo.toFixed(2)+'px');
    // Los puntos de enganche estan en _ini + k*_mw - _fijo. Se busca el primero que
    // quede DESPUES del final del scroll y se agrega solo esa diferencia: asi el tope
    // cae en un enganche sin dejar un vacio enorme en pantallas anchas.
    const _max=_w.scrollWidth-_w.clientWidth;
    const _b=_ini-_fijo;
    const _k=Math.ceil((_max-_b)/_mw);
    const _obj=_b+Math.max(0,Math.min(_k,_ms.length-1))*_mw;
    t.style.marginRight=Math.max(0,Math.ceil(_obj-_max))+'px';},0);}

// La foto mensual de los 6 estados, congelada por el generador (ver foto_mensual en
// generar_dashboard.py). Una por mes, escrita en la primera corrida y nunca mas tocada.
// Los estados que recorre el Historico. Son los mismos siete de Estado Stock: el
// 19/10 se rearmaron las fotos de septiembre y octubre con el Exceso abierto en
// leve y grave, asi que los tres meses hablan el mismo idioma.
// ⚠️ Vive aparte de STK porque aca cada estado trae ademas su color de LINEA, que
// no es el de la pastilla: sobre fondo blanco el amarillo no se ve.
const STKH=[['cero','Quiebre','#e53935'],['riesgo','Riesgo','#ef6c00'],
  ['ideal','Ideal','#2e7d32'],['excleve','Exceso leve','#f2c200'],

// ⚠️ Vista de Estado Stock: 'hoy' son las tarjetas y el detalle; 'hist' es la foto
// mensual de los estados, que hasta el 19/10 vivia en Historico Ventas.
// Que mide el grafico de un estado: 'n' los SKU, o el costo en la moneda elegida.
// ⚠️ Las solapas quedan pegadas DEBAJO de la barra de filtros, y ese alto no se puede
// escribir a mano: la barra envuelve en uno o dos renglones segun el ancho de la
// pantalla. Se mide y se escribe en su propia hoja, el mismo recurso que usan los `top`
// de las tablas. En `setTimeout` y no en rAF: rAF no corre con la pestana en segundo
// plano y la calibracion quedaria sin hacer.
// ⚠️ Se mide DOS veces, a los 0 y a los 350ms. La primera agarra la barra todavia
// armandose --los desplegables se llenan despues y el filtro de Estado se va al segundo
// renglon-- y daba 91px cuando el alto real es 131, asi que las solapas tapaban 32px de
// la barra. El observador de abajo cubre los cambios posteriores (achicar la ventana,
// elegir un filtro que agrega una pastilla).
function fijarTabs(){[0,350].forEach(ms=>setTimeout(()=>_fijarTabsYa(),ms));}
function _fijarTabsYa(){
  // ⚠️ Los cuatro `top` se MIDEN en cadena: cada barra arranca donde termina la de
  // arriba. Escritos a mano se desincronizan en cuanto la barra de filtros pasa de un
  // renglon a dos, que es lo que hace al achicar la ventana o al elegir un filtro.
  const fb=document.getElementById('filterbar'),tb=document.querySelector('.tabs');
  if(!fb||!tb)return;
  let hoja=document.getElementById('tabpos');
  if(!hoja){hoja=document.createElement('style');hoja.id='tabpos';document.head.appendChild(hoja);}
  const escribir=()=>{
    const hF=Math.round(fb.getBoundingClientRect().height);
    const tTabs=56+hF;
    const hT=Math.round(tb.getBoundingClientRect().height);
    const lb=document.querySelector('#view-st .liqbar');
    const hL=lb?Math.round(lb.getBoundingClientRect().height):0;
    hoja.textContent='.tabs{top:'+tTabs+'px;}'
      +'#view-st .liqbar{top:'+(tTabs+hT)+'px;}'
      +'#view-st .totrow{top:'+(tTabs+hT+hL)+'px;}';};
  escribir();
  // y se queda mirando la barra de filtros, que es la que cambia de alto sola
  if(!window._fbObs&&window.ResizeObserver){
    window._fbObs=new ResizeObserver(()=>escribir());
    window._fbObs.observe(fb);}}
window.addEventListener('resize',fijarTabs);

// ⚠️ SEIS GRAFICOS, UNO POR ESTADO, CADA UNO CON SU ESCALA (Erik, 19/10). Antes eran dos
// graficos grandes con un eje compartido, y ahi Quiebre (2.477) aplastaba a Lanzamientos
// (58): 43 veces de diferencia, los chicos pegados al piso. Con un eje por grafico el
// problema desaparece y no hay que apagar series para poder mirar.
// ⚠️ Van 3 y 3, en el MISMO orden que las tarjetas de la vista Actual y con la misma
// pastilla, para que al alternar entre vistas cada estado este donde uno lo busca.
// ⚠️ Sin rotacion no tiene grafico: es stock quieto, no una alarma para mirar mes a mes.
function panelesHistStock(meses, vis, H){
  const nf=v=>Math.round(v).toLocaleString('es-AR');
  const suma=(m,k)=>{let t=0;vis.forEach(g=>{const x=((H[m]||{}).ga||{})[g];
    if(x&&x[k])t+=x[k].n;});return t;};
  // ⚠️ Las marcas del eje Y se CALCULAN, no se reparten a ojo: un paso de 1, 2, 2,5 o 5
  // por la potencia de diez que corresponda, asi el eje dice 2.200 / 2.400 / 2.600 y no
  // 2.393 / 2.435 / 2.477. El paso nunca baja de 1: son SKU, no hay medios.
  const escalaLinda=(mn,mx)=>{
    if(mx===mn){const d=Math.max(1,Math.abs(mx)*0.1);mn-=d;mx+=d;}
    const p0=(mx-mn)/3, mag=Math.pow(10,Math.floor(Math.log10(p0||1)));
    let paso=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=p0)||10*mag;
    paso=Math.max(1,paso);
    const lo=Math.floor(mn/paso)*paso, hi=Math.ceil(mx/paso)*paso, t=[];
    for(let v=lo;v<=hi+1e-9;v+=paso)t.push(v);

// ====================== PESTANA STOCK ======================
// Modelo min/max, el mismo que usa el Excel:
//   Venta ajustada (col BV) = el ritmo mensual. Meses actual = Stock / Venta ajustada.
//   MAXIMO = 'Meses por Cat.' (col H) x el nivel elegido, pasado a unidades con ese ritmo.
//   MINIMO = minMeses(): importados el maximo menos 1 mes; el resto la mitad del
//            maximo (ver el comentario de minMeses, arriba de mcell).
// Estados: Quiebre (<=0) / Riesgo (bajo el minimo) / Ideal (en rango) / Exceso (sobre el maximo).
// Comparar por unidades y por meses da lo mismo, porque los dos usan el mismo ritmo:
// por eso el punto rojo del tab Forecast y esta pestana ya no se contradicen.
// STK = [clave, etiqueta, fondo de pastilla, color de letra, subtitulo]
const STK=[['cero','Quiebre','#e53935','#fff','Sin stock o en negativo'],
           ['riesgo','Riesgo','#ef6c00','#fff','Por debajo del mínimo'],
           ['ideal','Ideal','#2e7d32','#fff','Entre el mínimo y el máximo'],
           ['excleve','Exceso leve','#fff176','#8d6e00','Por encima del máximo'],
           ['excgrave','Exceso grave','#ffd600','#e30613','Muy por encima del máximo'],
           ['sinrot','Sin rotación','#78839c','#fff','Con stock y sin ventas en 6 meses'],
           ['lanz','Lanzamientos','#1565c0','#fff','Cat N, P y sin Cat']];

let _skC=new Map(),_skM=null;
// ⚠️ La cache se tira sola cuando cambia el corte leve/grave. Sin esto se mueve el
// desplegable y la tabla sigue mostrando los estados viejos.
function stkOf(r){const m=st.excCut||1.5;
  if(_skM!==m){_skC=new Map();_skM=m;}
  let v=_skC.get(r);if(v===undefined){v=stkCalc(r);_skC.set(r,v);}return v;}
function stkCalc(r){
  const id=r[IDEAL],stock=r[4];
  if(stock==null||id==null||id<=0)return null;
  // El maximo sale del Excel (col CP): la suma de la demanda de los proximos
  // "Meses por Cat." meses, cada uno con SU estacionalidad. Antes era meses por
  // venta ajustada, un ritmo plano, y siempre daba mas.
  // ⚠️ El maximo es el del Excel, sin multiplicador: el indicador "Maximo x N" se
  // saco el 16/10 al partir el Exceso en leve y grave, que es lo que respondia.
  const maxU=(r[MAXE]||0);
  // El minimo es la regla de siempre, en proporcion sobre esa base: importados
  // un mes menos, el resto la mitad. No se puede restar "un mes" en unidades
  // porque los meses de CP no valen lo mismo entre si.
  const minU=maxU*((DATA.UN[r[0]]===UN_IMPO)?Math.max(0,(id-1)/id):0.5);
  // ⚠️ El Faltante responde "cuanto tengo que comprar", asi que descuenta la
  // compra del mes que ya esta en camino. Sin esto pedia invertir de nuevo en
  // 1.413 codigos que ya estaban cubiertos por su propia compra (el 52% de los
  // que estan en Quiebre o Riesgo): USD 70.373 y $ 3,3 millones ya gastados.
  const compraMes=mval(r,0,2)||0;
  const exc=Math.max(0,stock-maxU),falta=Math.max(0,maxU-stock-compraMes);
  const faltaBruto=Math.max(0,maxU-stock);
  // Sin rotacion va ANTES que el resto: un codigo que no vendio tiene ritmo cero,
  // asi que su maximo da cero y caeria en Exceso siempre. Ponerlo primero saca del
  // Exceso a los que estan ahi por no venderse, no por haber comprado de mas.
  //
  // La ventana de vrHist son los 6 meses CERRADOS: el mes en curso no esta. Por eso
  // se mira aparte si el stock bajo desde el 1ro -- si se movio, vendio, y no puede
  // decir "sin ventas". Esos van a su estado por min/max y llevan el punto verde.
  //
  // Y los Cat N van aparte: un C que no se vende no es lo mismo que un lanzamiento
  // que todavia no se exhibio. Ademas pesan: eran el 76% de los dolares parados.
  // La venta del mes en curso, que el Excel no publica. Dos fuentes:
  //  - r[VACU]: lo que el generador viene sumando corrida a corrida comparandose
  //    con el dashboard anterior. Cuenta las BAJAS, asi que no le importa por que
  //    subio el stock (nota de credito, devolucion, correccion) y agarra el caso
  //    que se perdia: el codigo que va 0 -> 1 -> 0 entre el 1ro y hoy.
  //  - la baja neta contra el stock del 1ro, que cubre lo que paso ANTES de que
  //    el generador empezara a acordarse.
  // Se toma la mayor: la acumulada nunca puede ser menor que la neta.
  const vend=Math.max(r[VACU]||0,Math.max(0,(mval(r,0,0)||0)-stock));
  const movio=vend>0;
  let k;
  // Cat P es "proximamente": nunca tuvo stock, asi que los 22 caian en Quiebre
  // y lo ensuciaban con una falta que no es tal.
  const _cat=DATA.CAT[r[3]];
  if(_cat==='N'||_cat==='P'||!_cat)k='lanz';
  else if(stock<=0)k='cero';
  else if(!vrHist(r[2])&&!movio)k='sinrot';
  else if(stock<minU)k='riesgo';
  // El Exceso va en dos tramos (Erik, 16/10): hasta 50% sobre el maximo es leve y
  // de ahi para arriba grave. Con maximo 4: leve 5 y 6, grave de 7 en adelante.
  else if(stock>maxU*(st.excCut||1.5))k='excgrave';
  else if(stock>maxU)k='excleve';
  else k='ideal';
  const cc=DATA.costos&&DATA.costos[r[2]];
  const costo=(cc&&cc[0]!=null)?cc[0]:null,cur=(cc&&cc[3])?cc[3]:'$',mix=r[104];
  // ⚠️ Marca, no estado: el codigo sigue siendo 'cero' o 'riesgo' para la tarjeta, el
  // filtro y la foto mensual. Solo cambia la pastilla, para no confundir un faltante
  // que ya tiene el pedido viajando con uno que no tiene nada en camino.
  const ing=((k==='cero'||k==='riesgo')&&compraMes>0);
  return {k:k,ing:ing,costo:costo,movio:movio,vend:vend,minU:minU,maxU:maxU,stock:stock,exc:exc,falta:falta,
    faltaBruto:faltaBruto,compraMes:compraMes,cur:cur,
    excC:(costo!=null)?exc*costo:null, excM:(mix!=null)?exc*mix:null,
    falC:(costo!=null)?falta*costo:null,
    perd:(k==='cero'||k==='riesgo')?perdU(r):0,
    perdM:((k==='cero'||k==='riesgo')&&mix!=null)?perdU(r)*mix:null,
    stkC:(costo!=null&&stock>0)?stock*costo:null,
    stkM:(mix!=null&&stock>0)?stock*mix:null,
    meses:r[5], r:r};
}

// ⚠️ EL GRAFICO DE UN ESTADO, con ejes. Vive suelto porque lo usan las seis filas de la
// vista Grafico. Las marcas del eje Y se CALCULAN: un paso de 1, 2, 2,5 o 5 por la
// potencia de diez que corresponda, asi el eje dice 2.200 / 2.400 y no 2.393 / 2.435.
// El paso nunca baja de 1: son SKU, no hay medios.
function escalaLinda(mn,mx){
  if(mx===mn){const d=Math.max(1,Math.abs(mx)*0.1);mn-=d;mx+=d;}
  const p0=(mx-mn)/3, mag=Math.pow(10,Math.floor(Math.log10(p0||1)));
  let paso=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=p0)||10*mag;
  paso=Math.max(1,paso);
  const lo=Math.floor(mn/paso)*paso, hi=Math.ceil(mx/paso)*paso, t=[];
  for(let v=lo;v<=hi+1e-9;v+=paso)t.push(v);
  return {lo:lo,hi:hi,ticks:t};}
// ⚠️ El eje NO arranca en cero, a proposito: Quiebre se mueve entre 2.393 y 2.477 y con
// el cero adentro los dos puntos quedarian pegados. Lo que interesa es el movimiento, y
// la escala lo dice en numeros.
function svgLinea(vals,labels,color,ancho,cur,clic,sel){
  // ⚠️ La plata se abrevia en miles y millones: sin eso el eje son numeros de 9
  // digitos y se come medio grafico.
  const nf=v=>{if(!cur)return Math.round(v).toLocaleString('es-AR');
    const a=Math.abs(v);
    if(a>=1e6)return cur+' '+(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M';
    if(a>=1e3)return cur+' '+(v/1e3).toLocaleString('es-AR',{maximumFractionDigits:0})+'k';
    return cur+' '+Math.round(v).toLocaleString('es-AR');};
  // ⚠️ El ancho entra por parametro y por defecto es 620. La vista Grafico lo MIDE
  // de la caja despues de dibujar: con un viewBox fijo y escala uniforme, en una
  // pantalla ancha el dibujo se ajusta por el alto y deja media caja vacia.
  const W=Math.max(360,Math.round(ancho||620));
  const HH=190,ML=(cur?76:58),MR=18,MT=20,MB=28,n=vals.length;
  const E=escalaLinda(Math.min(...vals),Math.max(...vals)), d=(E.hi-E.lo)||1;
  const X=i=>(n<2)?(ML+(W-ML-MR)/2):ML+(i/(n-1))*(W-ML-MR);
  const Y=v=>HH-MB-((v-E.lo)/d)*(HH-MT-MB);
  const mx=Math.max(...vals), mn=Math.min(...vals);
  const iMx=vals.indexOf(mx), iMn=vals.indexOf(mn);
  const marca=i=>(n<=6)||i===0||i===n-1||i===iMx||i===iMn;
  // ⚠️ Las etiquetas de abajo tambien se saltean: entran cinco sin pisarse, y la ultima
  // va siempre porque es "Hoy", que es lo que se mira.
  const paso=Math.max(1,Math.ceil(n/5));
  const verLbl=i=>(n<=5)||i===n-1||((n-1-i)%paso===0&&i!==n-2);
  let g='<svg viewBox="0 0 '+W+' '+HH+'" preserveAspectRatio="xMidYMid meet">';
  E.ticks.forEach(v=>{const y=Y(v).toFixed(1);
    g+='<line x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'" stroke="#eceff6" stroke-width="1"/>'
      +'<text x="'+(ML-8)+'" y="'+(+y+4).toFixed(1)+'" text-anchor="end" font-size="12" fill="#8a90b0">'+nf(v)+'</text>';});
  g+='<line x1="'+ML+'" y1="'+MT+'" x2="'+ML+'" y2="'+(HH-MB)+'" stroke="#c5cad8" stroke-width="1.2"/>'
    +'<line x1="'+ML+'" y1="'+(HH-MB)+'" x2="'+(W-MR)+'" y2="'+(HH-MB)+'" stroke="#c5cad8" stroke-width="1.2"/>';
  if(n>1){const id='gr'+Math.random().toString(36).slice(2,8);
    g+='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/>'
      +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="M'+vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' L')
      +' L'+X(n-1).toFixed(1)+','+(HH-MB)+' L'+X(0).toFixed(1)+','+(HH-MB)+' Z" fill="url(#'+id+')"/>'
      +'<polyline points="'+vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')
      +'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';}
  vals.forEach((v,i)=>{const x=X(i),y=Y(v),ult=(i===n-1&&n>1);
    // ⚠️ Area de toque de 16px invisible encima del punto: un circulo de 4,5 es
    // imposible de acertar con el mouse.
    if(clic)g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="16" fill="transparent"'
      +' style="cursor:pointer" onclick="'+clic+'('+i+')"><title>'+labels[i]+'</title></circle>';
    g+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(ult?6:4.5)+'" fill="'+color+'"'
      +(ult?' stroke="#fff" stroke-width="2.5"':'')
      +(sel===i?' stroke="#1a237e" stroke-width="3"':'')+' style="pointer-events:none"/>';
    const an=(i===0&&n>1)?'start':(ult?'end':'middle');

    if(verLbl(i))g+='<text x="'+x.toFixed(1)+'" y="'+(HH-8)+'" text-anchor="'+an
      +'" font-size="12" fill="'+(ult?'#1a237e':'#8a90b0')+'"'+(ult?' font-weight="700"':'')
      +'>'+labels[i]+'</text>';});
  return g+'</svg>';}

function renderStock(){
  const el=document.getElementById('view-st');
  // ⚠️ `rowsBase()` aplica todos los filtros MENOS el de Estado --si tambien lo
  // aplicara, al elegir Quiebre las otras cinco tarjetas darian cero y no se podrian
  // comparar-- pero el cruce de Rotacion SI tiene que entrar: con "En baja" puesto,
  // las tarjetas tienen que contar como se reparten esos codigos entre los seis

  const P={};
  const add=(b,cur,v)=>{if(v==null||!v)return;(P[b]||(P[b]={}))[cur]=(P[b][cur]||0)+v;};
  dat.forEach(o=>{const g=G[o.k];g.n++;g.u+=o.stock;g.exc+=o.exc;g.falta+=o.falta;
    if(o.ing)g.cIng++;
    const _c=DATA.CAT[o.r[3]];

    else if(_c==='P')g.cP++;else if(!_c)g.cS++;

    if(o.k==='lanz'){add('stkC_lanz',o.cur,o.stkC);add('stkM_lanz',o.cur,o.stkM);}

  // Los tres sub-estados, con la MISMA cuenta de plata: stock x costo y stock x mix.
  // ⚠️ No se usa el bucket de la tarjeta de cada codigo: en un cruce mezclaria
  // 'costo inmovilizado' con 'costo a invertir' y el total no significaria nada.
  const ROTG={sinrot:null,baja:null,alza:null};

      const abierto=!!(st.grafAbre&&st.grafAbre[k])&&!enFoto;
      let detalle='';
      if(abierto){const _todas=rows;
        rows=_todas.filter(o=>o.k===k);
        // ⚠️ Respeta Por codigo / Por grupo. Llamaba siempre a mkTb() sin mirar VIS,
        // asi que el boton del encabezado quedaba de adorno. Es la tercera vez que
        // pasa lo mismo con ese boton.
        detalle='<div class="grafdet"><div class="tablewrap" style="max-height:380px">'
          +'<table class="prevt">'+cg+th+(VIS==='ga'?mkGrp():mkTb())+'</table></div>'
          +(VIS==='ga'?'':pieTope('st',rows.length,Math.min(tope,rows.length)))+'</div>';
        rows=_todas;}
      // ⚠️ El "vs" en NUMEROS, que es lo que Erik echaba de menos: con el mes elegido
      // compara ese mes contra el anterior, y en Hoy compara contra la ultima foto.
      let vsTxt='';
      if(dibuja){const iHoy=HM.length;
        const iAct=(mi==null)?iHoy:mi, iAnt=iAct-1;
        if(iAnt>=0){const vAct=(iAct>=iHoy)?G[k].n:foto(HM[iAct],k,'n');
          const vAnt=foto(HM[iAnt],k,'n'), dd=vAct-vAnt;
          vsTxt=(dd===0?'igual que '+mesCorto(HM[iAnt])
            :((dd>0?'\u25b2 ':'\u25bc ')+fmtI(Math.abs(dd))+' SKU vs '+mesCorto(HM[iAnt])));}}
      filas+='<div class="grafila'+(abierto?' abierta':'')+'">'
        +'<div class="grafcard"'+(enFoto?'':(' onclick="tglGrafDet(&quot;'+k+'&quot;)"'))
        +' style="--bc:'+c[2]+'"'
        +(enFoto?(' style="cursor:default" data-tip="El detalle es siempre de hoy"'
            +' data-tip2="La foto del mes guarda totales por grupo, no el detalle por código"')
          :(' title="'+(abierto?'Tocá para cerrar el detalle':'Tocá para ver el detalle')+'"'))+'>'
        +card(c,ft,enFoto?mesLargo(HM[mi]):null,vsTxt)+'</div>'
        +'<div class="grafbox" data-k="'+k+'">'+sel+gr+'</div></div>'+detalle;});
    // ⚠️ Los controles de los seis graficos viven ACA (Erik, 19/10): uno por grafico
    // era mas trabajo para decir lo mismo.

    // ⚠️ Se mira SI HAY PLATA en esa moneda, no la Unidad de negocio: asi funciona
    // igual filtrando por Grupo, que es como se llega al mismo lugar por otro camino.
    const hayCur=cu=>CARDS.some(c=>hayPlata(c,cu));
    // ⚠️ Un solo boton "Plata" (Erik, 19/10): el dashboard elige la moneda en vez de
    // hacerlo elegir. La que tiene datos con el filtro puesto, o la del total mas
    // grande si las dos tienen. Sigue sin sumar pesos con dolares: elige una.
    const totCur=cu=>CARDS.reduce((t,c)=>t+hoyPlata(c,cu),0);
    // ⚠️ Con las dos monedas disponibles, tocar "Plata" ALTERNA entre ellas. Antes
    // elegia la del total mas grande y, sin filtro, los pesos siempre ganan --son
    // millones contra miles-- asi que a USD no se llegaba nunca.
    const curMejor=()=>{const a=hayCur('$'),b=hayCur('USD');
      if(a&&!b)return '$'; if(b&&!a)return 'USD';
      if(!a&&!b)return null;
      const act=st.grafVerG;
      if(act==='$')return 'USD';
      if(act==='USD')return '$';
      return (totCur('USD')>=totCur('$'))?'USD':'$';};
    const _vg=st.grafVerG||'n';
    // y si la moneda elegida se apago, se vuelve a SKU en vez de quedar en blanco
    if(st.grafVerG&&st.grafVerG!=='n'&&!hayCur(st.grafVerG))st.grafVerG='n';
    const bg=(v,txt,on,activo,tip)=>'<button'+(activo?(' onclick="setGrafVerG(&quot;'+v+'&quot;)"'):' disabled')
      +(tip?(' data-tip2="'+tip+'"'):'')
      +' style="font:inherit;font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px;'
      +'border:1px solid '+(on?'#1a237e':'#c5cad8')+';background:'+(on?'#1a237e':'#fff')+';'
      +'color:'+(on?'#fff':(activo?'#5a6178':'#c5cad8'))+';'
      +'cursor:'+(activo?'pointer':'default')+';">'+txt+'</button>';
    const mopt=HM.map((m,i)=>'<option value="'+i+'"'+((st.grafMesG===i)?' selected':'')
        +'>'+mesLargo(m)+'</option>').join('')
      +'<option value=""'+((st.grafMesG==null)?' selected':'')+'>Hoy</option>';
    el.innerHTML='<div class="liqbar">'
      +'<span class="liqlbl" data-tip="Exceso leve" data-tip2="Hasta cuántas veces el máximo un exceso es leve; de ahí para arriba es grave">Exceso leve</span>'
      +'<select onchange="setExcCut(this)" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;">'+eopt+'</select>'
      +'<span style="width:12px"></span><span class="liqlbl" data-tip="Qu\u00e9 miden los gr\u00e1ficos">Ver</span>'
      +'<span style="display:inline-flex;gap:4px;">'+bg('n','SKU',_vg==='n',true)
      +bg(curMejor()||'$',(_vg==='n'?'Plata':('Plata \u00b7 '+(_vg==='$'?'$':'USD'))),
          _vg!=='n',!!curMejor(),
          (hayCur('$')&&hayCur('USD'))?'Toc\u00e1 de nuevo para cambiar de moneda':'')+'</span>'
      +'<span style="width:12px"></span><span class="liqlbl" data-tip="Mes" data-tip2="Qu\u00e9 mes muestran las tarjetas">Mes</span>'
      +'<select onchange="setGrafMesG(this)" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;">'+mopt+'</select>'
      // ⚠️ Rotacion se habia ido con el selector Vista, y con ella los dos cruces: no
      // habia forma de llegar a "En baja" ni a "En alza".
      +'<span style="width:12px"></span>'
      +'<span class="liqlbl" data-tip="Rotaci\u00f3n" data-tip2="Como viene la venta real: el \u00faltimo trimestre cerrado contra el anterior">Rotaci\u00f3n</span>'
      +'<select onchange="setRotSub(this.value)" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;margin-right:5px;">'+sopt+'</select>'
      +'<select onchange="setRotU(this)" data-tip="Umbral" data-tip2="Desde cu\u00e1nto cuenta como baja o alza" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;">'+ropt+'</select>'
      +'</div>'+totales
      +'<div class="grafwrap">'+filas+'</div>';
    // ⚠️ Recien ahora se puede medir: el ancho de la caja depende del monitor. En
    // setTimeout y no en requestAnimationFrame, porque rAF no corre con la pestana en
    // segundo plano y la calibracion quedaria sin hacer.
    clearTimeout(window._grafTmr);
    window._grafTmr=setTimeout(()=>{
      _grafRedibujo.forEach(g=>{
        const box=el.querySelector('.grafbox[data-k="'+g.k+'"]');
        if(!box)return;
        const w=Math.round(box.clientWidth-20);
        if(w<=360)return;
        // el selector no se redibuja: se conserva tal cual estaba
        const viejo=box.querySelector('.grafsel');
        box.innerHTML=(viejo?viejo.outerHTML:'')
          +svgLinea(g.serie,g.lbl,g.color,w,g.cur,g.clic,g.sel);});},0);
    return;}
  el.innerHTML=
    '<div class="liqbar">'+'<span class="liqlbl" data-tip="Exceso leve" data-tip2="Hasta cu\u00e1ntas veces el m\u00e1ximo un exceso es leve; de ah\u00ed para arriba es grave">Exceso leve</span>'+'<select onchange="setExcCut(this)" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;">'+eopt+'</select>'+'<span style="width:14px"></span><span class="liqlbl" data-tip="Rotaci\u00f3n" data-tip2="Como viene la venta real: el ultimo trimestre cerrado contra el anterior">Rotaci\u00f3n</span>'+'<select onchange="setRotSub(this.value)" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;margin-right:5px;">'+sopt+'</select>'+'<select onchange="setRotU(this)" data-tip="Umbral" data-tip2="Desde cu\u00e1nto cuenta como baja o alza" style="padding:3px 6px;border:1px solid #c5cae9;border-radius:6px;font-size:.75rem;">'+ropt+'</select>'+'</div>'
    +'<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-top:12px;">'+CARDS.map(c=>card(c)).join('')
    +'</div>'
    +'<div class="sec-h" style="margin-top:16px">📦 Detalle <span style="font-weight:600;color:#8a90b0;font-size:.72rem">('+fmtI(rows.length)+' SKU)</span></div>'
    +'<div class="tablewrap" id="stTbl" style="max-height:427px">'
      +'<div style="padding:16px;color:#8a90b0;font-size:.74rem;">Armando el detalle de '+fmtI(rows.length)+' SKU…</div></div>';
  // La tabla son ~77.000 celdas: si se dibuja junto con el resto, el cambio de
  // solapa se siente trabado. Se pinta el encabezado primero y la tabla al toque
  // siguiente, asi la pantalla aparece al instante.
  clearTimeout(window._stTmr);
  window._stTmr=setTimeout(()=>{const w=document.getElementById('stTbl');
    if(!w)return;
    // los dos cruces de rotacion tienen tabla propia; Sin rotacion usa la de siempre
    if(st.ROT){w.innerHTML=tablaRot(rows);return;}
    w.innerHTML='<table class="prevt">'+cg+th+(VIS==='ga'?mkGrp():mkTb())+'</table>'
      +(VIS==='ga'?'':pieTope('st',rows.length,Math.min(tope,rows.length)));},0);
}
// ---- Calculos de Estado Stock ----
// La venta REAL del historico. DATA.hist.months viene de mas viejo a mas nuevo y el
// mes en curso no esta (no cerro), asi que los ultimos 6 son los 6 meses cerrados.
const VRM=6;
function vrHist(cod){const H=DATA.hist;if(!H||!H.real)return null;const a=H.real[cod];
  if(!a)return null;let t=0;for(let i=Math.max(0,a.length-VRM);i<a.length;i++)t+=a[i]||0;return t;}
// Lo que se pierde por un quiebre = DEMANDA menos VENTA PROYECTADA.
//   demanda (col CJ, r[79]) = lo que venderias este mes al ritmo actual
//   venta proy (col CK)     = lo que si vas a vender, contando las compras en camino
// Ninguna de las dos sola sirve: la proyectada da CERO justo en los peores quiebres
// (ASX11: demanda 1.316, proyectada 0) y la demanda cobra ventas que si vas a hacer
// cuando llegue el pedido (MA-4147: demanda 96, proyectada 89, perdes 7).
// ⚠️ La proyectada esta topeada por el stock al 1ro + compras, no por el de HOY. Si
// entro mercaderia durante el mes (REDB-111: 0 al 1ro, 1 hoy) proyecta cero y la
// perdida salia entera, contradiciendo la columna "Stock hoy" de la misma fila.
// Vendible = lo mayor entre la proyectada y lo que hay en la mano.
function perdU(r){
  const vend=Math.max(r[VACU]||0,Math.max(0,(mval(r,0,0)||0)-(r[4]||0)));
  const v=Math.max(mval(r,0,3)||0,vend+(r[4]||0));
  return Math.max(0,(r[79]||0)-v);}
function renderTab(t){fijarTabs();const _sy=window.scrollY;if(t==='fc')renderForecast();else if(t==='st')renderStock();else if(t==='liq')renderLiq();else if(t==='vp')renderVP();else renderHist();st.dirty[t]=false;requestAnimationFrame(()=>window.scrollTo(0,_sy));}
let _rt=null;
function renderAll(){updBtns();st.tope={};st.dirty.fc=st.dirty.st=st.dirty.liq=st.dirty.vp=st.dirty.hist=true;clearTimeout(_rt);_rt=setTimeout(()=>renderTab(st.tab),80);}
function exportCSV(){const rows=sortRows(visibleRows());let head=["UN","GA","Codigo","Categoria","Meses/Cat","Stock actual","Meses actual"];ALLM.forEach(m=>MFIELDS.forEach(f=>head.push(DATA.months[m]+" - "+f)));
  let lines=[head.join(";")];rows.forEach(r=>{let l=[DATA.UN[r[0]],DATA.GA[r[1]],r[2],DATA.CAT[r[3]],r[IDEAL],r[4],r[5]];ALLM.forEach(m=>{for(let f=0;f<6;f++)l.push(mval(r,m,f));});lines.push(l.join(";"));});
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="forecast_dashboard.csv";a.click();}
document.getElementById('gen').textContent="Actualizado: "+DATA.gen;
// Tooltip propio. El `title` nativo lo pinta el sistema operativo y no admite estilos,
// y hacia falta que el nombre de la columna y la ayuda de uso fueran de distinto color.
// Va colgado del body, no dentro del th: las tablas tienen overflow:hidden y se lo
// comerian. Es uno solo para todo el dashboard.
(function(){
  const d=document.createElement('div');d.id='tip';document.body.appendChild(d);
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let on=null;
  function pos(e){const m=8,r=d.getBoundingClientRect();
    let x=e.clientX+14,y=e.clientY+18;
    if(x+r.width>innerWidth-m)x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-m)y=e.clientY-r.height-12;
    d.style.left=Math.max(m,x)+'px';d.style.top=Math.max(m,y)+'px';}
  function ocultar(){d.style.display='none';on=null;}
  document.addEventListener('mouseover',e=>{
    const t=e.target&&e.target.closest?e.target.closest('[data-tip],[data-tip2]'):null;
    if(t===on)return;
    on=t;
    if(!t){d.style.display='none';return;}
    const a=t.getAttribute('data-tip')||'',b=t.getAttribute('data-tip2')||'';
    d.innerHTML=(a?esc(a):'')+((a&&b)?'<br>':'')+(b?'<span class="t2">'+esc(b)+'</span>':'');
    d.style.display='block';pos(e);});
  document.addEventListener('mousemove',e=>{if(on)pos(e);});
  document.addEventListener('scroll',ocultar,true);
  window.addEventListener('blur',ocultar);
})();

buildBar();renderAll();
</script>
